name: IKEA Frekvens LED multi-use light

on:
  merge_group:
    types:
      - checks_requested

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    name: Context
    uses: ./.github/workflows/context.yml

  default:
    name: Default
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for Node.js
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: nodejs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webapp/package-lock.json') }}
          path: ~/.npm

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          echo "IKEA_FREKVENS='true'" >> .env

          cat <<'EOL' > firmware/include/config/secrets.h
          #pragma once
          #define PIN_CS 1
          #define PIN_MOSI 2
          #define PIN_OE 3
          #define PIN_SCLK 4
          #define PIN_SW1 5
          #define PIN_SW2 6
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          EOL

          uv run --only-group platformio pio run -e "$PIO_ENVIRONMENT"

  minimal:
    name: Minimal
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > .env
          EXTENSION_BUTTON='true'
          FONT_MICRO='true'
          IKEA_FREKVENS='true'
          MODE_ARROW='true'
          MODE_BLINDS='true'
          MODE_EQUALIZER='true'
          MODE_RING='true'
          MODE_WAVEFORM='true'
          EOL

          cat <<'EOL' > firmware/include/config/secrets.h
          #pragma once
          #define PIN_CS 1
          #define PIN_MOSI 2
          #define PIN_OE 3
          #define PIN_SCLK 4
          #define PIN_SW1 5
          #define PIN_SW2 6
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          EOL

          uv run --only-group platformio pio run -e "$PIO_ENVIRONMENT"

  typical:
    name: Typical
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}
        exclude:
          - environment: adafruit_qtpy_esp32s2
          - environment: adafruit_qtpy_esp32s3_n4r2
          - environment: esp32-c3-devkitm-1
          - environment: esp32-c5-devkitc-1
          - environment: esp32-c6-devkitm-1
          - environment: esp32dev
          - environment: lolin_d32
          - environment: lolin_d32_pro
          - environment: lolin_s3_mini
          - environment: seeed_xiao_esp32c3
          - environment: seeed_xiao_esp32c6
          - environment: wemos_d1_mini32

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for Node.js
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: nodejs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webapp/package-lock.json') }}
          path: ~/.npm

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > .env
          EXTENSION_ALEXA='true'
          EXTENSION_BUTTON='true'
          EXTENSION_HEAP='true'
          EXTENSION_HOMEASSISTANT='true'
          EXTENSION_MESSAGE='true'
          EXTENSION_MICROPHONE='true'
          EXTENSION_MQTT='true'
          EXTENSION_OTA='true'
          EXTENSION_PLAYLIST='true'
          EXTENSION_RESTFUL='true'
          EXTENSION_SCREENSHOT='true'
          EXTENSION_SERVERSENTEVENTS='true'
          EXTENSION_SIGNAL='true'
          EXTENSION_STATUSLED='true'
          EXTENSION_WEBAPP='true'
          EXTENSION_WEBSOCKET='true'
          FONT_LARGE='true'
          FONT_MEDIUM='true'
          FONT_MEDIUMBOLD='true'
          FONT_MEDIUMWIDE='true'
          FONT_MICRO='true'
          FONT_MINI='true'
          FONT_SMALL='true'
          IKEA_FREKVENS='true'
          MODE_ANIMATION='true'
          MODE_ARROW='true'
          MODE_BINARYCLOCK='true'
          MODE_BINARYEPOCH='true'
          MODE_BLINDS='true'
          MODE_BLINK='true'
          MODE_BREAKOUTCLOCK='true'
          MODE_BRIGHT='true'
          MODE_CIRCLE='true'
          MODE_CLOCK='true'
          MODE_COUNTDOWN='true'
          MODE_DRAW='true'
          MODE_EQUALIZER='true'
          MODE_FIREWORK='true'
          MODE_FLIES='true'
          MODE_GAMEOFLIFE='true'
          MODE_GLITTER='true'
          MODE_HOMETHERMOMETER='true'
          MODE_LEAFFALL='true'
          MODE_LINES='true'
          MODE_METABALLS='true'
          MODE_NOISE='true'
          MODE_PINGPONG='true'
          MODE_PIXELSEQUENCE='true'
          MODE_RAIN='true'
          MODE_RING='true'
          MODE_SCAN='true'
          MODE_SNAKE='true'
          MODE_STARS='true'
          MODE_STREAM='true'
          MODE_TICKER='true'
          MODE_WAVEFORM='true'
          MODE_WEATHER='true'
          WEATHER_OPENMETEO='true'
          WEATHER_WTTRIN='true'
          WEATHER_YR='true'
          NAME='Frekvens'
          EOL

          cat <<'EOL' > firmware/include/config/secrets.h
          #pragma once
          #define LATITUDE "0.000"
          #define LOCATION "redacted"
          #define LONGITUDE "0.000"
          #define MQTT_HOST "mqtt.local"
          #define MQTT_KEY "redacted"
          #define MQTT_USER "redacted"
          #define PIN_CS 1
          #define PIN_LED 2
          #define PIN_MIC 3
          #define PIN_MOSI 4
          #define PIN_OE 5
          #define PIN_SCLK 6
          #define PIN_SW1 7
          #define PIN_SW2 8
          #define WIFI_KEY "redacted"
          #define WIFI_SSID "redacted"
          EOL

          uv run --only-group platformio pio run -e "$PIO_ENVIRONMENT"

  extensive:
    name: Extensive
    needs: context
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: ${{ fromJSON(needs.context.outputs.pio-environments) }}
        exclude:
          - environment: adafruit_qtpy_esp32s2
          - environment: adafruit_qtpy_esp32s3_n4r2
          - environment: esp32-c3-devkitm-1
          - environment: esp32-c5-devkitc-1
          - environment: esp32-c6-devkitm-1
          - environment: esp32dev
          - environment: lolin_d32
          - environment: lolin_d32_pro
          - environment: lolin_s3_mini
          - environment: seeed_xiao_esp32c3
          - environment: seeed_xiao_esp32c6
          - environment: wemos_d1_mini32

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache for Node.js
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: nodejs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webapp/package-lock.json') }}
          path: ~/.npm

      - name: Restore Cache for PlatformIO
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: ${{ runner.environment == 'github-hosted' }}
          key: platformio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platformio.ini') }}
          path: .platformio/.cache/downloads

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          version: latest-known

      - name: PlatformIO build
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          cat <<'EOL' > .env
          EXTENSION_ALEXA='true'
          EXTENSION_BUTTON='true'
          EXTENSION_HEAP='true'
          EXTENSION_HOMEASSISTANT='true'
          EXTENSION_INFRARED='true'
          EXTENSION_MESSAGE='true'
          EXTENSION_MICROPHONE='true'
          EXTENSION_MQTT='true'
          EXTENSION_OTA='true'
