          FONT_MEDIUMWIDE='true'
          FONT_MICRO='true'
          FONT_MINI='true'
          FONT_SMALL='true'
          HOSTNAME='frekvens'
          IKEA_FREKVENS='true'
          MODE_ANIMATION='true'
          MODE_ARROW='true'
          MODE_BINARYCLOCK='true'
          MODE_BINARYEPOCH='true'
          MODE_BLINDS='true'
          MODE_BLINK='true'
          MODE_BREAKOUTCLOCK='true'
          MODE_BRIGHT='true'
          MODE_CIRCLE='true'
          MODE_CLOCK='true'
          MODE_COUNTDOWN='true'
          MODE_DRAW='true'
          MODE_EQUALIZER='true'
          MODE_FIREWORK='true'
          MODE_FLIES='true'
          MODE_GAMEOFLIFE='true'
          MODE_GLITTER='true'
          MODE_HOMETHERMOMETER='true'
          MODE_LEAFFALL='true'
          MODE_LINES='true'
          MODE_METABALLS='true'
          MODE_NOISE='true'
          MODE_PINGPONG='true'
          MODE_PIXELSEQUENCE='true'
          MODE_RAIN='true'
          MODE_RING='true'
          MODE_SCAN='true'
          MODE_SNAKE='true'
          MODE_STARS='true'
          MODE_STREAM='true'
          MODE_TICKER='true'
          MODE_WAVEFORM='true'
          MODE_WEATHER='true'
          NAME='Frekvens'
          OTA_KEY='redacted'
          TEMPERATURE_UNIT='°C'
          TIME_ZONE='Etc/Universal'
          WEATHER_GOOGLE='true'
          WEATHER_HOMEASSISTANT='true'
