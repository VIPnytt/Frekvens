          EXTENSION_SIGNAL='true'
          EXTENSION_STATUSLED='true'
          EXTENSION_WEBAPP='true'
          EXTENSION_WEBSOCKET='true'
          FONT_BRAILLE='true'
          FONT_LARGE='true'
          FONT_MEDIUM='true'
