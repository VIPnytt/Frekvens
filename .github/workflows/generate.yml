name: Generate

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  font-dejavusans:
    name: DejaVuSans font
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          version: latest-known

      - name: Font generator
        run: |
          uv run --extra font --no-dev extra/Python/FontGenerator.py -i DejaVuSans --size 8

          mv DejaVuSansFont.cpp firmware/src/fonts
          mv DejaVuSansFont.h firmware/include/fonts

      - name: Clang format
        uses: cpp-linter/cpp-linter-action@8e85cd02c8c3fe3ae527c94b5683fe2366b144ed # v2.20.0
        id: clang
        env:
          clang-version: 22
        with:
          version: ${{ env.clang-version }}
          files-changed-only: false
          ignore: "*|!firmware/src/fonts/DejaVuSansFont.cpp|!firmware/include/fonts/DejaVuSansFont.h"
          step-summary: true
          style: file
          tidy-checks: "-*"

      - name: Clang summary
        env:
          clang-threshold: 0
        run: |
          echo "Status: ${{ steps.clang.outputs.checks-failed }} checks failed, threshold for success is ${{ env.clang-threshold }}."
          echo "Clang report:"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }}"
          else
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit $(( ${{ steps.clang.outputs.checks-failed }} > ${{ env.clang-threshold }} ))

